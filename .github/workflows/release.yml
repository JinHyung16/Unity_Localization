name: release

on:
  push:
    tags: ["v*"]

jobs:
  # Unity 패키지 tgz. 커밋된 패키지를 그대로 묶는다
  # git URL 설치(?path=/Packages/com.translation.unity#<태그>)도 같은 파일을 쓴다
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      PACKAGE_DIR: Packages/com.translation.unity
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 package.json 버전 대조
        run: |
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(jq -r .version "$PACKAGE_DIR/package.json")"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::태그는 $TAG 인데 package.json version 은 $PACKAGE_VERSION 이다"
            exit 1
          fi

      - name: 커밋된 Translation.Core.dll 확인
        run: |
          for f in Plugins.meta Plugins/Translation.Core.dll Plugins/Translation.Core.dll.meta Plugins/Translation.Core.pdb Plugins/Translation.Core.pdb.meta Plugins/Translation.Core.xml Plugins/Translation.Core.xml.meta; do
            test -f "$PACKAGE_DIR/Runtime/$f" || { echo "::error::$f 가 커밋되지 않았다. dotnet build Tools/Translation.Core -c Release 후 커밋한다"; exit 1; }
          done

      - name: tgz
        run: |
          cp -R "$PACKAGE_DIR" "$RUNNER_TEMP/package"
          tar -czf "Translation.Unity-$TAG.tgz" -C "$RUNNER_TEMP" package

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: Translation.Unity-${{ github.ref_name }}.tgz

  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet publish Tools/Translation.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:CopyToUnityPackage=false -o publish
      - run: Compress-Archive -Path publish/translation.exe -DestinationPath translation-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: translation-win-x64.zip

  release:
    needs: [package, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/translation-win-x64.zip
            dist/Translation.Unity-${{ github.ref_name }}.tgz
