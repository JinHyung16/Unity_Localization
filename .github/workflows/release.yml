name: release

on:
  push:
    tags: ["v*"]

jobs:
  cli:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet publish Tools/Translation.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - run: Compress-Archive -Path publish/translation.exe -DestinationPath translation-win-x64.zip
      - run: tar -czf Translation.Unity-${{ github.ref_name }}.tgz --transform "s,^Packages/com.translation.unity,package," Packages/com.translation.unity
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            translation-win-x64.zip
            Translation.Unity-${{ github.ref_name }}.tgz
